# Eid Charity operations platform: app + SQL Server + Cloudflare Tunnel.
# Usage:  cp .env.example .env  (fill the values)  &&  docker compose up -d --build
name: eid-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
      TZ: Asia/Qatar
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published to the host: only the app reaches the database.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Eid: "Server=sqlserver,1433;Database=EidCharity;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Seed__DefaultPassword: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      Storage__Root: /app/data/files
      DataProtection__KeysPath: /app/data/keys
      Jobs__Enabled: "true"
      Database__MigrateAndSeed: "true"
    volumes:
      - appdata:/app/data
    # Exposed only on the host loopback for local checks; public traffic comes through the tunnel.
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - app

volumes:
  sqldata:
  appdata:
